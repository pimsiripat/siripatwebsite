design:
  theme: engineeringclassic

  page:
    size: a4
    top_margin: 0.4in
    bottom_margin: 0.4in
    left_margin: 0.4in
    right_margin: 0.4in
    show_footer: false
    show_top_note: false

  colors:
    body: rgb(0, 0, 0)
    name: rgb(55, 123, 181)
    headline: rgb(55, 123, 181)
    connections: rgb(0, 0, 0)
    section_titles: rgb(55, 123, 181)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(0, 0, 0)

  typography:
    line_spacing: 0.4em
    alignment: justified 
    date_and_location_column_alignment: right
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 11pt
      name: 30pt
      headline: 11pt
      connections: 11pt
      section_titles: 1.15em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true

  header:
    alignment: center
    space_below_name: 0.5cm
    space_below_headline: 0.5cm
    space_below_connections: 0.5cm
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: '|'
      space_between_connections: 0.2cm

  section_titles:
    type: with_full_line
    line_thickness: 1pt
    space_above: 0.5cm
    space_below: 0.3cm

  sections:
    allow_page_break: true
    space_between_regular_entries: 1.1em
    space_between_text_based_entries: 0.3em

  entries:
    date_and_location_width: 4.15cm
    side_space: 0cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0.1cm
      space_above: 0.1cm
      space_between_items: 0.15cm
      space_between_bullet_and_text: 0.15em

  templates: 
    date_range: START_DATE – END_DATE
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION** - DEGREE in AREA 
      date_and_location_column: |-
        DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        DATE
    experience_entry:
      main_column: |-
        **POSITION** -- COMPANY
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        DATE