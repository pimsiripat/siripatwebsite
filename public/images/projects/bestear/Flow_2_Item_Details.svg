<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Flow two: the buyer opens an item detail page, reviews the gallery, price, stock and delivery, then the fit, battery and full specification table with reviews. A decision point asks whether they want to compare with other pairs. If yes, the pair is added to a compare tray and the specifications are shown side by side. If no, the buyer returns to the results list with their filters intact.">
  <style>
    .fn-box{fill:#fff;stroke:#12233F;stroke-width:1.6}
    .fn-term{fill:#12233F;stroke:#12233F;stroke-width:1.6}
    .fn-dec{fill:#FFF3EA;stroke:#FF6B00;stroke-width:1.8}
    .fn-alt{fill:#F5F6F8;stroke:#5B6779;stroke-width:1.4;stroke-dasharray:6 4}
    .fn-t{font-family:system-ui,sans-serif;font-size:13px;font-weight:500;fill:#12233F;text-anchor:middle}
    .fn-i{fill:#ffffff}
    .fn-lab{font-family:ui-monospace,monospace;font-size:11px;fill:#C24E00;letter-spacing:.06em}
    .fn-note{font-family:ui-monospace,monospace;font-size:11px;fill:#5B6779;letter-spacing:.04em}
    .fl{stroke:#12233F;stroke-width:1.6;fill:none}
    .fl-d{stroke:#5B6779;stroke-width:1.4;fill:none;stroke-dasharray:6 5}
  </style>
  <rect x="0" y="0" width="960" height="280" fill="#FFFFFF"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#12233F"/></marker>
    <marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B6779"/></marker>
  </defs>

  <rect class="fn-box" x="20"  y="42" width="130" height="56" rx="9"/>
  <text class="fn-t" x="85"  y="66">Open item</text><text class="fn-t" x="85" y="84">detail page</text>

  <rect class="fn-box" x="176" y="42" width="130" height="56" rx="9"/>
  <text class="fn-t" x="241" y="66">Gallery, price,</text><text class="fn-t" x="241" y="84">stock, delivery</text>

  <rect class="fn-box" x="332" y="42" width="130" height="56" rx="9"/>
  <text class="fn-t" x="397" y="66">Fit, battery,</text><text class="fn-t" x="397" y="84">specs + reviews</text>

  <polygon class="fn-dec" points="553,18 621,70 553,122 485,70"/>
  <text class="fn-t" x="553" y="66">Compare</text><text class="fn-t" x="553" y="84">with others?</text>

  <rect class="fn-box" x="644" y="42" width="130" height="56" rx="9"/>
  <text class="fn-t" x="709" y="66">Add to</text><text class="fn-t" x="709" y="84">compare tray</text>

  <rect class="fn-term" x="800" y="42" width="140" height="56" rx="28"/>
  <text class="fn-t fn-i" x="870" y="66">Specs side</text><text class="fn-t fn-i" x="870" y="84">by side</text>

  <rect class="fn-alt" x="453" y="188" width="210" height="56" rx="9"/>
  <text class="fn-t" x="558" y="212">Not a fit — keep the</text><text class="fn-t" x="558" y="230">filters, return to results</text>

  <path class="fl" d="M150 70 H172" marker-end="url(#a2)"/>
  <path class="fl" d="M306 70 H328" marker-end="url(#a2)"/>
  <path class="fl" d="M462 70 H481" marker-end="url(#a2)"/>
  <path class="fl" d="M621 70 H640" marker-end="url(#a2)"/>
  <path class="fl" d="M774 70 H796" marker-end="url(#a2)"/>
  <path class="fl" d="M553 122 V184" marker-end="url(#a2)"/>
  <path class="fl-d" d="M453 216 H85 V104" marker-end="url(#d2)"/>

  <text class="fn-lab" x="630" y="60">YES</text>
  <text class="fn-lab" x="563" y="152">NO</text>
  <text class="fn-note" x="96" y="150">back to results</text>
</svg>
